name: Notify Team

on:
  workflow_run:
    workflows:
      - Test Local Model
      - Sync to Hugging Face Hub
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send workflow result to team webhook
        env:
          WEBHOOK_URL: ${{ secrets.TEAM_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "TEAM_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          status = os.environ["WORKFLOW_STATUS"]
          icon = "✅" if status == "success" else "❌"
          message = (
              f"{icon} GitHub Actions: {os.environ['WORKFLOW_NAME']} "
              f"{status} on {os.environ['BRANCH']}\\n"
              f"Commit: {os.environ['COMMIT_SHA'][:7]}\\n"
              f"Run: {os.environ['RUN_URL']}"
          )

          webhook_url = os.environ["WEBHOOK_URL"]
          if "discord.com/api/webhooks" in webhook_url or "discordapp.com/api/webhooks" in webhook_url:
              payload = {"content": message}
          else:
              payload = {"text": message}

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  if response.status >= 300:
                      raise RuntimeError(f"Webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Webhook rejected the notification with HTTP {error.code}: {details}"
              ) from error
          PY
